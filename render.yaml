services:
  - type: web
    name: claimsathi-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=@claimsathi/web
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://claimsathi-api.onrender.com

  - type: web
    name: claimsathi-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build --workspace=@claimsathi/api
    # Render's free plan has no pre-deploy command, so migrations run here, before the server starts.
    startCommand: npm run migrate:deploy --workspace=@claimsathi/api && npm start --workspace=@claimsathi/api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: claimsathi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: claimsathi-queue
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://claimsathi-web.onrender.com
      # Set on Render only. Never put the key in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

  - type: keyvalue
    name: claimsathi-queue
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: claimsathi-db
    plan: free
    region: singapore
